    :root{--paper:#f8f5ef;--ink:#28251f;--muted:#817b70;--line:#e9e3d9;--orange:#bd5630;--card:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans KR',sans-serif;line-height:1.8}.wrap{width:min(780px,calc(100% - 36px));margin:auto}header{padding:23px 0;border-bottom:1px solid var(--line)}.nav,footer{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-size:19px;font-weight:900;color:var(--ink);text-decoration:none}.brand span{color:var(--orange)}nav a,.links a{color:var(--orange);font-size:13px;font-weight:700;text-underline-offset:4px}main{padding:54px 0 75px}main>small{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:1.5px}h1{font-size:40px;letter-spacing:-1.8px;line-height:1.25;margin:10px 0 13px}p{font-size:14px;color:#625d54;margin:9px 0}.lead{font-size:16px;color:var(--muted);margin-bottom:28px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:25px}.field{margin:0 0 18px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dcd4c8;border-radius:9px;background:#fff;padding:12px;font:inherit;font-size:14px;color:var(--ink)}.field textarea{min-height:180px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #e7784b;outline-offset:2px}.required{color:var(--orange)}.note{font-size:12px;color:var(--muted);margin:0 0 18px}.submit{border:0;border-radius:9px;padding:13px 20px;background:var(--orange);color:white;font:inherit;font-weight:800;cursor:pointer}.submit:hover{background:var(--orange-dark,#a94729)}.trap{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}.links{display:flex;gap:16px;flex-wrap:wrap}footer{padding:22px 0 30px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}@media(max-width:520px){h1{font-size:34px}main{padding-top:38px}.panel{padding:19px}.nav,footer{align-items:flex-start;flex-direction:column}}

  <header><div class="wrap nav"><a class="brand" href="./">animal<span>?</span></a><nav aria-label="사이트 메뉴"><a href="./">테스트</a> · <a href="about.html">사이트 소개</a></nav></div></header>
  <main class="wrap">
    <small>CONTACT</small><h1>문의 및 의견</h1>
    <p class="lead">오류 신고, 개선 제안, 개인정보 관련 문의를 보내 주세요.</p>
    <form class="panel" action="https://formspree.io/f/mrpqkqna" method="POST">
      <div class="trap" aria-hidden="true"><label>Leave this field empty<input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
      <input type="hidden" name="_subject" value="animal? 문의 및 의견">
      <div class="field"><label for="name">이름 <span class="required">*</span></label><input id="name" name="name" autocomplete="name" required maxlength="100"></div>
      <div class="field"><label for="email">답변 받을 이메일 <span class="required">*</span></label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="topic">문의 유형</label><select id="topic" name="topic"><option>일반 문의</option><option>오류 신고</option><option>개선 의견</option><option>개인정보 관련 문의</option></select></div>
      <div class="field"><label for="message">내용 <span class="required">*</span></label><textarea id="message" name="message" required maxlength="5000"></textarea></div>
      <p class="note">문의 처리를 위해 입력한 정보가 Formspree를 통해 운영자에게 전달됩니다. 사진이나 비밀번호 등 민감한 정보는 입력하지 마세요. 자세한 내용은 <a href="privacy.html">개인정보 처리 안내</a>를 확인해 주세요.</p>
      <button class="submit" type="submit">문의 보내기</button>
    </form>
  </main>
